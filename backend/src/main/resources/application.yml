server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:facturestudio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@facturestudio.local}
    password: ${APP_ADMIN_PASSWORD:Admin12345!}
    full-name: ${APP_ADMIN_FULL_NAME:Administrateur Facture Studio}
  jwt:
    secret: ${APP_JWT_SECRET:replace-this-development-secret-with-a-strong-production-secret-key}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:1440}
  quotas:
    free-export-limit: ${APP_FREE_EXPORT_LIMIT:5}
  paydunya:
    master-key: ${PAYDUNYA_MASTER_KEY:}
    private-key: ${PAYDUNYA_PRIVATE_KEY:}
    token: ${PAYDUNYA_TOKEN:}
    api-base-url: ${PAYDUNYA_API_BASE_URL:https://app.paydunya.com/sandbox-api/v1}
    store-name: ${PAYDUNYA_STORE_NAME:Facture Studio}
    success-url: ${PAYDUNYA_SUCCESS_URL:http://localhost:8080/api/billing/paydunya/return}
    cancel-url: ${PAYDUNYA_CANCEL_URL:http://localhost:8080/api/billing/paydunya/cancel}
    callback-url: ${PAYDUNYA_CALLBACK_URL:http://localhost:8080/api/billing/paydunya/callback}
    amounts:
      premium: ${PAYDUNYA_PREMIUM_AMOUNT:4900}
      branches: ${PAYDUNYA_BRANCHES_AMOUNT:19900}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
