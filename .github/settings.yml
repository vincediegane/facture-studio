repository:
  default_branch: dev
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

branches:
  - name: prod
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
      required_status_checks:
        strict: true
        contexts:
          - Frontend build
          - Backend tests
      enforce_admins: true
      restrictions: null
  - name: staging
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
      required_status_checks:
        strict: true
        contexts:
          - Frontend build
          - Backend tests
      enforce_admins: false
      restrictions: null
